{% extends 'base.html' %}{% block title %}Login{% endblock %}
{% block body %}
<div class="card login"><h2>Sign in</h2>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="tabs">
    <label><input type="radio" name="as" value="staff" checked onchange="lab()"><span>Staff</span></label>
    <label><input type="radio" name="as" value="patient" onchange="lab()"><span>Patient</span></label>
  </div>
  <label id="ulab">Staff username</label><input name="username" required autofocus autocomplete="username">
  <div style="height:10px"></div>
  <label>Password</label><input name="password" type="password" required autocomplete="current-password">
  <div style="height:14px"></div><button style="width:100%">Log in</button>
  <p class="note">Patients: use the Patient ID given by the staff at registration.</p>
</form></div>
<script>function lab(){document.getElementById('ulab').textContent=document.querySelector('[name=as]:checked').value=='staff'?'Staff username':'Patient ID'}</script>
{% endblock %}
